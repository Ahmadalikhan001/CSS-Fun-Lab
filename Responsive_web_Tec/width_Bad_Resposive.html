<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3">

    <title>Bad Width and Responsive Width</title>
</head>

<body>
    <h1>Bad Width is the fixed width.</h1>
    <div style="width: 100px; height: 60px; background-color: lightblue;">
        <p>This div has a fixed width of 100px.</p>
    </div>
    <h1>Responsive Width adjusts based on the screen size.and we use percentages to achieve this.</h1>
    <div style="width: 50%; height: 50%; background-color: lightgreen;">
        <p>This div has a responsive width of 50%.</p>
</body>

</html>
