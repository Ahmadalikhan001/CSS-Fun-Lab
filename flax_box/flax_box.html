<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3">
    <title>FlaxBox Exercises</title>
</head>
<style>
    .container {
        border: 2px solid black;
        min-height: 500px;
        display: flex;
        flex-wrap: wrap;
    }

    .container>div {
        background-color: lightblue;
        width: 100px;
        height: 100px;
        margin: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
    }
</style>

<body>
    <div class="container">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <div>Box 4</div>
        <div>Box 5</div>
        <div>Box 6</div>
    </div>
</body>

</html>
