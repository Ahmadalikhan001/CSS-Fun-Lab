<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3">
    <title>Media Queries</title>
</head>
<style>
    h1,
    p {
        font-size: 32px;
    }

    @media screen and (max-width: 600px) {
        body {
            background-color: lightblue;
            font-size: 8px;

            h,
            p {
                font-size: 2em;
            }
        }

    }
</style>

<body>
    <h1>Media Queries</h1>
    <p>Media queries allow you to apply different styles based on the characteristics of the device or viewport.</p>
</body>

</html>
