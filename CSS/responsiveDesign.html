<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- This below is the meta tag that sets the viewport properties for responsive design. It ensures that the webpage scales correctly on different devices, such as mobile phones and tablets, by setting the width of the viewport to match the device's width and setting the initial zoom level to 1.0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design</title>
    <style>
        @media screen and (max-width: 600px) {
            body {
                background-color: lightblue;
            }

        }
    </style>
</head>

<body>
    <h1>Responsive Design Example</h1>
    <p>Resize the browser window to see the background color change when the width is 600px or less.</p>
</body>

</html>
