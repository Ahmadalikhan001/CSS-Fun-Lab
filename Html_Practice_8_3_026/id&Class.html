<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3">
    <title>Id & Class</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .example {
            color: blue;
            background-color: lightgray;
        }

        #special {
            color: red;
            background-color: lightgray;
        }
    </style>
</head>

<body>
    <h1>Id and class Use and Training</h1>
    <h3>For example the below paragraph is targeted with a class:</h3>
    <p class="example">This is a paragraph with a class.</p>
    <h3>For example the below paragraph is targeted with an id:</h3>
    <p id="special">This is a paragraph with an id.</p>
</body>

</html>
